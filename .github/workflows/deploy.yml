name: Deply to EKS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  oidc-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::713395823754:role/aws-kubernetes-lab-github-actions-deploy
          aws-region: ap-northeast-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity
