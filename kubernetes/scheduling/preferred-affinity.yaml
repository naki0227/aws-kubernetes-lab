apiVersion: apps/v1
kind: Deployment
metadata:
  name: preferred-demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: preferred-demo
  template:
    metadata:
      labels:
        app: preferred-demo
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: zone
                    operator: In
                    values:
                      - a
      containers:
        - name: busybox
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]