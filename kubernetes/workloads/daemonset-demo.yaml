apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: daemon-demo
spec:
  selector:
    matchLabels:
      app: daemon-demo
  template:
    metadata:
      labels:
        app: daemon-demo
    spec:
      containers:
        - name: daemon-demo
          image: busybox:1.36
          command: ["sh", "-c", "while true; do sleep 3600; done"]