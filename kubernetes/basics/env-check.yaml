apiVersion: v1
kind: Pod
metadata:
  name: env-check
spec:
  containers:
    - name: env-check
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      env:
        - name: APP_MESSAGE
          valueFrom:
            configMapKeyRef:
              name: api-config
              key: APP_MESSAGE

        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: api-secret
              key: API_KEY